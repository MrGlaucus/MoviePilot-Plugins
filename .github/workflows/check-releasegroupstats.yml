name: Check ReleaseGroupStats
"on":
  pull_request:
    paths:
      - 'plugins.v2/releasegroupstats/**'
      - 'plugins.v3/releasegroupstats/**'
      - 'tests/**'
      - 'scripts/release_plugins.py'
      - 'package.v2.json'
      - 'package.v3.json'
      - '.github/workflows/check-releasegroupstats.yml'
  push:
    branches: [main]
    paths:
      - 'plugins.v2/releasegroupstats/**'
      - 'plugins.v3/releasegroupstats/**'
      - 'tests/**'
      - 'scripts/release_plugins.py'
      - 'package.v2.json'
      - 'package.v3.json'
      - '.github/workflows/check-releasegroupstats.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pydantic>=2,<3' 'APScheduler>=3.10,<4'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q plugins.v2/releasegroupstats plugins.v3/releasegroupstats scripts tests
      - run: git diff --check
