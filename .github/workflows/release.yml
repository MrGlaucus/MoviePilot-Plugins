name: Plugin Release
"on":
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package.v2.json'
      - 'package.v3.json'
  workflow_dispatch:
    inputs:
      package:
        description: 'Index to package (versions must match their source)'
        type: choice
        options: [package.v3.json, package.v2.json, package.json]
        default: package.v3.json

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate versions and build exact-generation packages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PACKAGE_FILE: ${{ inputs.package }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/release_plugins.py --package "$PACKAGE_FILE"
          else
            python scripts/release_plugins.py --before "$BEFORE_SHA"
          fi
      - name: Publish new immutable releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r tag asset; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag exists; preserving it. Bump the version for new source."
              continue
            fi
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag exists without a Release; refusing to attach a different source."
              exit 1
            fi
            gh release create "$tag" "$asset" --title "$tag" \
              --notes "Automated release of $tag" --latest=false --target "$GITHUB_SHA"
          done < <(jq -r '.[] | [.tag, .asset] | @tsv' .cache/release-plan.json)
